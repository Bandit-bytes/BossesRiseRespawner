plugins {
 id 'java-library'
 id 'net.neoforged.moddev' version '2.0.148'
 id 'idea'
}
version = '0.1.0'
group = 'studio.pixeldream'
base { archivesName = 'bossesrise_respawner' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
 version = '21.1.265'
 runs { client { client() }; server { server(); programArgument '--nogui' } }
 mods { bossesrise_respawner { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
idea { module { downloadSources = true } }

dependencies { runtimeOnly fileTree(dir: 'libs', include: ['*.jar']) }
